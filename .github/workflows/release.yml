name: Release

# Push a tag such as v0.1.0 to build, sign and publish the APK.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Derive the version from the tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${name%%-*}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OPEN_KIOSK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The OPEN_KIOSK_KEYSTORE_BASE64 secret is not set; see RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build the signed APK
        working-directory: android
        env:
          OPEN_KIOSK_KEYSTORE: ${{ runner.temp }}/release.jks
          OPEN_KIOSK_KEYSTORE_PASSWORD: ${{ secrets.OPEN_KIOSK_KEYSTORE_PASSWORD }}
          OPEN_KIOSK_KEY_ALIAS: ${{ secrets.OPEN_KIOSK_KEY_ALIAS }}
          OPEN_KIOSK_KEY_PASSWORD: ${{ secrets.OPEN_KIOSK_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
          -Popenkiosk.versionName=${{ steps.version.outputs.name }}
          -Popenkiosk.versionCode=${{ steps.version.outputs.code }}

      - name: Verify the signature and stage the assets
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "$apk" | head -3
          mkdir dist
          cp "$apk" "dist/open-kiosk-${{ steps.version.outputs.name }}.apk"
          # A fixed name gives a permanent "latest" download link.
          cp "$apk" dist/open-kiosk.apk
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "Open Kiosk ${{ steps.version.outputs.name }}"
          --generate-notes
