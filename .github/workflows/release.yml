name: Release

# Builds, signs and attaches the APK to the release for a version tag.
# Works whether the release was created first in the GitHub UI (the usual
# way: tag and release together) or only a tag was pushed. Run it by hand
# with a tag to rebuild the assets of an existing release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Derive the version from the tag
        id: version
        run: |
          # The tag can come from a manual input, so check its shape before use.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag such as v1.0.0"
            exit 1
          fi
          name="${TAG#v}"
          IFS=. read -r major minor patch <<< "${name%%-*}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OPEN_KIOSK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The OPEN_KIOSK_KEYSTORE_BASE64 secret is not set; see RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build the signed APK and App Bundle
        working-directory: android
        env:
          OPEN_KIOSK_KEYSTORE: ${{ runner.temp }}/release.jks
          OPEN_KIOSK_KEYSTORE_PASSWORD: ${{ secrets.OPEN_KIOSK_KEYSTORE_PASSWORD }}
          OPEN_KIOSK_KEY_ALIAS: ${{ secrets.OPEN_KIOSK_KEY_ALIAS }}
          OPEN_KIOSK_KEY_PASSWORD: ${{ secrets.OPEN_KIOSK_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:bundleRelease
          -Popenkiosk.versionName=${{ steps.version.outputs.name }}
          -Popenkiosk.versionCode=${{ steps.version.outputs.code }}

      - name: Verify the signature and stage the assets
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "$apk" | head -3
          mkdir dist
          cp "$apk" "dist/open-kiosk-${{ steps.version.outputs.name }}.apk"
          # A fixed name gives a permanent "latest" download link.
          cp "$apk" dist/open-kiosk.apk
          # The App Bundle is what Google Play takes.
          aab=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" > /dev/null
          cp "$aab" "dist/open-kiosk-${{ steps.version.outputs.name }}.aab"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS)

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Attach the assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Open Kiosk ${{ steps.version.outputs.name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TITLE" --generate-notes
          fi
